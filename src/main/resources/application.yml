server:
  port: 8086

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2

  data:
    redis:
      host: localhost
      port: 6379

report:
  cache:
    ttl-hours: 2